<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#B5502A">
  <title>Entrar - Raízes do Nordeste</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">
  <link rel="stylesheet" href="css/style.css?v=12">
</head>
<body>
  <header id="cabecalho"></header>

  <main class="container pagina">
    <div class="auth">
      <div class="auth-topo">
        <img src="img/logo.svg" alt="">
        <h1>Que bom te ver!</h1>
        <p class="texto-suave">Entre para fazer seu pedido e juntar pontos.</p>
      </div>

      <section class="cartao">
        <p id="avisoVoltar" class="mensagem info escondido">
          <span data-icone="info"></span>
          <span>Entre na sua conta para finalizar o pedido.</span>
        </p>

        <form id="formLogin" novalidate>
          <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" autocomplete="email" placeholder="voce@email.com">
          </div>
          <div class="campo">
            <label for="senha">Senha</label>
            <input type="password" id="senha" autocomplete="current-password">
          </div>
          <p id="mensagemLogin" class="mensagem escondido"></p>
          <button type="submit" class="botao botao-bloco">Entrar</button>
        </form>

        <p class="centro" style="margin: 16px 0 0;">Ainda não tem conta? <a id="linkCadastro" href="cadastro.html">Cadastre-se</a></p>
      </section>

      <p class="mensagem aviso">
        <span data-icone="info"></span>
        <span>Usuário de teste: <strong>maria@teste.com</strong> · senha <strong>123456</strong></span>
      </p>
    </div>
  </main>

  <footer id="rodape"></footer>

  <script src="js/dados.js?v=12"></script>
  <script src="js/comum.js?v=12"></script>
  <script src="js/login.js?v=12"></script>
</body>
</html>
