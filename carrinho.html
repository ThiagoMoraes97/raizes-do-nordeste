<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#B5502A">
  <title>Carrinho - Raízes do Nordeste</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">
  <link rel="stylesheet" href="css/style.css?v=9">
</head>
<body>
  <header id="cabecalho"></header>

  <main class="container pagina">
    <div class="pagina-topo">
      <div>
        <span class="sobretitulo">Seu pedido</span>
        <h1>Carrinho</h1>
      </div>
    </div>

    <div id="carrinhoVazio" class="cartao estado-vazio escondido">
      <span class="estado-vazio-icone" data-icone="carrinho"></span>
      <h2>Seu carrinho está vazio</h2>
      <p class="texto-suave">Que tal uma tapioca quentinha para começar o dia?</p>
      <a href="cardapio.html" class="botao">Ver cardápio</a>
    </div>

    <div id="areaCarrinho" class="layout-lateral">
      <div class="pilha">
        <section class="cartao">
          <div class="secao-cabecalho">
            <h2>Itens</h2>
            <a href="cardapio.html">+ Adicionar mais</a>
          </div>
          <div id="listaItens"></div>
        </section>

        <section class="cartao">
          <h2>Como você quer receber?</h2>
          <div class="grade-opcoes">
            <label class="opcao-cartao">
              <input type="radio" name="tipo" value="Retirada no balcão">
              <span class="icone-caixa" data-icone="sacola"></span>
              <span><strong>Retirar no balcão</strong><small>Pick-up rápido, sem fila</small></span>
            </label>
            <label class="opcao-cartao">
              <input type="radio" name="tipo" value="Consumir na loja">
              <span class="icone-caixa" data-icone="loja"></span>
              <span><strong>Consumir na loja</strong><small>Levamos até a sua mesa</small></span>
            </label>
          </div>
        </section>
      </div>

      <aside class="cartao">
        <h2>Resumo</h2>

        <label for="campoCupom">Cupom de desconto</label>
        <div class="linha">
          <input type="text" id="campoCupom" placeholder="Ex.: RAIZES10">
          <button id="btnCupom" class="botao botao-secundario">Aplicar</button>
        </div>
        <p id="mensagemCupom" class="mensagem escondido"></p>

        <div id="areaPontos"></div>

        <div class="resumo-linha"><span>Subtotal</span><span id="subtotal"></span></div>
        <div class="resumo-linha"><span>Descontos</span><span id="desconto" class="desconto-valor"></span></div>
        <div class="resumo-linha resumo-total"><span>Total</span><span id="total"></span></div>

        <p id="avisoLogin" class="mensagem info escondido">
          <span data-icone="info"></span>
          <span>Para pedir pelo App ou pelo Site é preciso entrar na sua conta.</span>
        </p>
        <button id="btnContinuar" class="botao botao-bloco" style="margin-top: 16px;">Ir para o pagamento</button>
        <p class="seguro"><span data-icone="cadeado"></span> Pagamento seguro por serviço externo</p>
      </aside>
    </div>
  </main>

  <footer id="rodape"></footer>

  <script src="js/dados.js?v=9"></script>
  <script src="js/comum.js?v=9"></script>
  <script src="js/carrinho.js?v=9"></script>
</body>
</html>
